# OpenHDID – 10k használati profil egy gépen: legfeljebb 10 000 ügyfél (500–800 egyidejű
# portálhasználó), 20–30 ügyintéző, egyetlen kiszolgálón. Kiegészítő fájl a compose.yaml mellé;
# a .env választja ki:
#
#   COMPOSE_FILE=compose.yaml:profiles/10k/single.yaml
#   COMPOSE_PROFILES=db,redis
#
# Méretezés: a 10k normál csúcsa (kb. 75 kérés/s) kétszerese, kb. 150 kérés/s egy gépen; ami
# fölötte érkezik, azt az nginx 429-cel vagy 503-mal elutasítja. Gazdagép: 8 vCPU, 16 GB RAM, 120 GB
# lemez. A memóriaplafonok összege kb. 12,8 GB (web 4480m, worker 3 × 384m, sync-worker 448m,
# scheduler 1g, migrate 384m, MariaDB 3584m, Valkey 768m, munkamenet-Valkey 1280m), mellette 1 GB
# az operációs rendszeré, a maradék a lapgyorsítótáré. 24 PHP-FPM folyamat (128 MB memory_limit),
# MariaDB 2 GB pufferrel és 60 kapcsolattal, Valkey 256 MB-tal (kiszorítás nélkül), munkamenet-
# Valkey 576 MB-tal (allkeys-lru), három feldolgozó az üzenetekre, egy a panelről indított
# ügyféltörzs-átvételre. Nincs magas rendelkezésre állás: a gép kiesése a szolgáltatás kiesése;
# ha ez nem elfogadható, a kétgépes 10k profil (profiles/10k/compose.yaml) vagy a Kubernetes a
# választás. A .env-ben megadott OPENHDID_FPM_*, OPENHDID_DB_*, OPENHDID_WEB_MEM_LIMIT és
# OPENHDID_VALKEY_* értékek az itteni alapértékeket írják felül; a plafont a hozzá tartozó
# értékkel együtt kell emelni.
#
# Részletek: docs/openhdid-telepitesi-utmutato.pdf (15. fejezet) és
# docs/openhdid-uzemeltetesi-kezikonyv.pdf (9. fejezet).

services:
  web:
    environment:
      HDID_SIZING_PROFILE: 10k-single
      OPENHDID_NGINX_WORKERS: ${OPENHDID_NGINX_WORKERS:-4}
      OPENHDID_FPM_PM: ${OPENHDID_FPM_PM:-dynamic}
      OPENHDID_FPM_MAX_CHILDREN: ${OPENHDID_FPM_MAX_CHILDREN:-24}
      OPENHDID_FPM_START_SERVERS: ${OPENHDID_FPM_START_SERVERS:-8}
      OPENHDID_FPM_MIN_SPARE_SERVERS: ${OPENHDID_FPM_MIN_SPARE_SERVERS:-8}
      OPENHDID_FPM_MAX_SPARE_SERVERS: ${OPENHDID_FPM_MAX_SPARE_SERVERS:-16}
    # 24 × 150 + 208 + 4 nginx workers × 80 + 256 (/tmp) + 64 ≈ 4448 MB.
    mem_limit: ${OPENHDID_WEB_MEM_LIMIT:-4480m}

  worker:
    environment:
      HDID_SIZING_PROFILE: 10k-single
    deploy:
      replicas: 3

  sync-worker:
    environment:
      HDID_SIZING_PROFILE: 10k-single

  scheduler:
    environment:
      HDID_SIZING_PROFILE: 10k-single

  # 2048M + 192 + 60 × 20 ≈ 3440 MB.
  mariadb:
    mem_limit: ${OPENHDID_DB_MEM_LIMIT:-3584m}

  valkey:
    mem_limit: ${OPENHDID_VALKEY_MEM_LIMIT:-768m}

  valkey-sessions:
    mem_limit: ${OPENHDID_VALKEY_SESSIONS_MEM_LIMIT:-1280m}

configs:
  mariadb-server:
    content: |
      [mariadbd]
      character-set-server = utf8mb4
      collation-server = utf8mb4_unicode_ci
      skip-name-resolve
      # 24 PHP-FPM + 3 workers + EMD worker + scheduler (3) + 6 spare = 37, with room: 60.
      innodb_buffer_pool_size = ${OPENHDID_DB_BUFFER_POOL:-2G}
      max_connections = ${OPENHDID_DB_MAX_CONNECTIONS:-60}
      key_buffer_size = 16M

  # A compose.yaml valkey beállításával azonos. A maxmemory-policy noeviction kötelező:
  # kiszorításnál korlátszámlálók, visszajátszás-védelem, zárak és várakozó feladatok vesznének
  # el csendben. A munkamenetek a valkey-sessions szolgáltatásban vannak.
  valkey:
    content: |
      appendonly yes
      save ""
      requirepass "${REDIS_PASSWORD:-}"
      maxmemory ${OPENHDID_VALKEY_MAXMEMORY:-256mb}
      maxmemory-policy noeviction

  # A 10k kétszeres terhelésének munkamenetei a teljes, 120 perces élettartamra (a kétgépes 10k
  # profil munkamenet-tárával azonos méret); fölötte a legrégebben használtak szorulnak ki.
  valkey-sessions:
    content: |
      appendonly no
      save 300 1
      stop-writes-on-bgsave-error no
      requirepass "${REDIS_PASSWORD:-}"
      maxmemory ${OPENHDID_VALKEY_SESSIONS_MAXMEMORY:-576mb}
      maxmemory-policy allkeys-lru
      maxmemory-samples 10
