# A panelről indított ügyféltörzs-átvétel sora (EMD_SYNC_QUEUE=sync): egy példány, saját sor,
# hogy egy hosszú átvétel ne tartsa fel a leveleket és az SMS-eket.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openhdid-sync-worker
  labels:
    app.kubernetes.io/component: sync-worker
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: sync-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/component: sync-worker
    spec:
      automountServiceAccountToken: false
      # Egy átvétel legfeljebb 1200 s: a leállítás megvárja.
      terminationGracePeriodSeconds: 1260
      securityContext:
        runAsNonRoot: true
        runAsUser: 82
        runAsGroup: 82
        fsGroup: 82
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sync-worker
          image: ghcr.io/adamfhun/openhdid
          args: [worker, sync]
          envFrom:
            - secretRef:
                name: openhdid-env
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # One PHP process (memory_limit 256M) and the 128 MB /tmp for spreadsheet imports.
          resources:
            requests: {cpu: 250m, memory: 448Mi}
            limits: {memory: 448Mi}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: storage, mountPath: /app/storage}
            - {name: ca, mountPath: /etc/openhdid/ca, readOnly: true}
      volumes:
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 128Mi}
        - name: storage
          persistentVolumeClaim:
            claimName: openhdid-storage
        - name: ca
          configMap:
            name: openhdid-ca
            optional: true
