apiVersion: apps/v1
kind: Deployment
metadata:
  name: openhdid-web
spec:
  replicas: 3
  template:
    spec:
      containers:
        - name: web
          env:
            - {name: HDID_SIZING_PROFILE, value: 20k}
          resources:
            requests: {cpu: "1", memory: 1536Mi}
            limits: {memory: 2Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openhdid-worker
spec:
  replicas: 3
  template:
    spec:
      containers:
        - name: worker
          env:
            - {name: HDID_SIZING_PROFILE, value: 20k}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openhdid-sync-worker
spec:
  template:
    spec:
      containers:
        - name: sync-worker
          env:
            - {name: HDID_SIZING_PROFILE, value: 20k}
          resources:
            requests: {cpu: 500m, memory: 512Mi}
            limits: {memory: 1536Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openhdid-scheduler
spec:
  template:
    spec:
      containers:
        - name: scheduler
          env:
            - {name: HDID_SIZING_PROFILE, value: 20k}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: openhdid-web
spec:
  minReplicas: 3
  maxReplicas: 6
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: openhdid-web
spec:
  minAvailable: 2
