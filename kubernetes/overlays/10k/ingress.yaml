# A saját kiszolgálónév (az APP_URL gazdagépe) mindkét helyen.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openhdid
spec:
  tls:
    - hosts: [hdid.example.org]
      secretName: openhdid-tls
  rules:
    - host: hdid.example.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: openhdid-web
                port:
                  name: http
