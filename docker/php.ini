; OpenHDID production PHP settings (loaded after the image defaults).

; Information disclosure: no PHP version header, no errors in responses.
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
zend.exception_ignore_args = On
html_errors = Off

; Only index.php runs; no path guessing, no remote includes.
cgi.fix_pathinfo = 0
allow_url_include = Off

; Upload limit matches the nginx client_max_body_size (10 MB).
upload_max_filesize = 10M
post_max_size = 12M
memory_limit = 256M
max_execution_time = 120

realpath_cache_size = 4096K
realpath_cache_ttl = 600

; The code in the image never changes: no timestamp checks.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.jit = disable
