; OpenHDID production PHP settings (loaded after the image defaults).

; Information disclosure: no PHP version header, no errors in responses.
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
zend.exception_ignore_args = On
html_errors = Off

; Only index.php runs; no path guessing, no remote includes.
cgi.fix_pathinfo = 0
allow_url_include = Off

; The session upload progress tracking is off (PHP security advisories of 2026-10-21 and
; 2026-10-23, CVE-2026-109619 and CVE-2026-115560): it runs while PHP parses the request body,
; before any application code could switch it off, and the application never uses it
; (Laravel keeps its own sessions). php-fpm.conf locks it for the web requests too.
session.upload_progress.enabled = 0

; Upload limit matches the nginx client_max_body_size (10 MB).
upload_max_filesize = 10M
post_max_size = 12M
memory_limit = 256M
; EMD sync and large imports: at least 120 s, 300 recommended (the same value
; applies to the CLI worker); php-fpm.conf request_terminate_timeout sits above it.
max_execution_time = 300

realpath_cache_size = 4096K
realpath_cache_ttl = 600

; The code in the image never changes: no timestamp checks.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.jit = disable
