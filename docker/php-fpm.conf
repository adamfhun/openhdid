; OpenHDID PHP-FPM pool. nginx talks to it over a Unix socket inside the same
; container, so no FastCGI port is ever exposed. Pool sizes come from the
; OPENHDID_FPM_* environment variables (defaults in the image).

[global]
pid = /tmp/openhdid/run/php-fpm.pid
error_log = /proc/self/fd/2
; Longer worker output lines are split, and only the first piece carries the
; message: the ADFS debug lines with both tokens run past 8 KiB.
log_limit = 65536
daemonize = no

[www]
listen = /tmp/openhdid/run/php-fpm.sock
listen.mode = 0600
; Requests waiting for a free process. When it is full, nginx gets no connection
; and answers 503 at once (OPENHDID_FPM_BACKLOG), instead of queueing for minutes.
listen.backlog = ${OPENHDID_FPM_BACKLOG}

pm = ${OPENHDID_FPM_PM}
pm.max_children = ${OPENHDID_FPM_MAX_CHILDREN}
pm.start_servers = ${OPENHDID_FPM_START_SERVERS}
pm.min_spare_servers = ${OPENHDID_FPM_MIN_SPARE_SERVERS}
pm.max_spare_servers = ${OPENHDID_FPM_MAX_SPARE_SERVERS}
pm.max_requests = 500
; nginx gives up after 120 s (fastcgi_read_timeout): the process is freed right
; after, not minutes later. No web request runs an EMD sync or an import (those
; are queued jobs); max_execution_time stays 300 s for the php status card.
request_terminate_timeout = 125s

; The memory of one web request (OPENHDID_FPM_MEMORY_LIMIT, 128M in the image):
; the imports, the EMD sync and the exports of many rows run in the worker or
; stream, so the web needs less than the CLI's 256M, and the processes ×
; this limit is what the web container's memory limit has to hold.
php_admin_value[memory_limit] = ${OPENHDID_FPM_MEMORY_LIMIT}
; Locked off for every web request (CVE-2026-115560): ini_set() cannot switch it back on.
php_admin_flag[session.upload_progress.enabled] = off

catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null

security.limit_extensions = .php
php_admin_value[disable_functions] = passthru,shell_exec,system

; Workers see no container environment: the configuration comes from the
; config cache written at start. Only the cache locations are passed on.
clear_env = yes
env[APP_CONFIG_CACHE] = $APP_CONFIG_CACHE
env[APP_ROUTES_CACHE] = $APP_ROUTES_CACHE
env[APP_EVENTS_CACHE] = $APP_EVENTS_CACHE
